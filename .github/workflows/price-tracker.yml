name: TAPP refill price tracker

on:
  schedule:
    - cron: "17 22 * * *" # daily, ~8-9am Sydney time
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency: price-tracker

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check prices and promos
        run: python price_tracker/track.py
      - name: Open an issue if anything changed
        if: hashFiles('report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo -e "\ncc @${{ github.repository_owner }}" >> report.md
          gh issue create \
            --title "TAPP refills: price/promo change $(date -u +%Y-%m-%d)" \
            --body-file report.md
      - name: Save new baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add price_tracker/state.json
          git diff --cached --quiet || (git commit -m "price-tracker: update snapshot" && git push)
